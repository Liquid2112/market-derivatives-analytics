[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-derivatives-analytics"
version = "0.1.0"
description = "Read-only analytics for prediction markets: pull Polymarket/Kalshi markets, show live order books, and model synthetic options (payoff, break-even, implied probability, Greeks)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools]
packages = ["derivatives_engine", "mdlab", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
